name: Build, Scan and Push Docker Image

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/raniweb
  # Use AWS ECR public mirror for vulnerability DB. The default GitHub Releases
  # mirror frequently hits rate limits from GHA runner IPs, which causes
  # `aquasecurity/trivy-action` to exit 1 even with `exit-code: '0'`.
  TRIVY_DB_REPOSITORY: public.ecr.aws/aquasecurity/trivy-db
  TRIVY_JAVA_DB_REPOSITORY: public.ecr.aws/aquasecurity/trivy-java-db
  # Pin Trivy binary version to a known-stable release. Auto-resolved latest
  # has produced exit-1 regressions on first-run DB downloads in past builds.
  TRIVY_VERSION: 0.58.1

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write # required for OIDC-based attestations
      security-events: write # upload SARIF from Trivy

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # SBOM + provenance attestations for supply-chain integrity
          provenance: true
          sbom: true

      - name: Pull image to local daemon for reliable scanning
        # Trivy performs `docker pull` internally. By pulling here first we
        # get a deterministic failure (auth/manifest/race) instead of a
        # generic exit-1 buried in DB-download noise, and we eliminate the
        # rare race where trivy polls GHCR before the manifest is visible.
        shell: bash
        run: |
          set -euo pipefail
          # Retry up to 3 times with exponential backoff to absorb the
          # GHCR propagation window right after `docker push`.
          for i in 1 2 3; do
            if docker pull "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest"; then
              echo "Pulled image on attempt $i"
              exit 0
            fi
            echo "Pull attempt $i failed, retrying in $((i*5))s..."
            sleep $((i*5))
          done
          echo "::error::Failed to pull image after 3 attempts"
          exit 1

      - name: Run Trivy vulnerability scan (image)
        # `continue-on-error` lets the SARIF-upload step still run so we
        # capture whatever findings were emitted before the failure.
        # Pin Trivy binary to 0.58.1 (v0.65.0 default has first-run DB
        # download regressions on GHA runners).
        continue-on-error: true
        uses: aquasecurity/trivy-action@v0.33.1
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          format: 'sarif'
          output: 'trivy-image-results.sarif'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true
          # Pin the installed Trivy version. The default is `v0.65.0` which
          # has caused exit-1 failures on first-run DB downloads in our
          # GHA environment. 0.58.1 is the latest known-stable release.
          version: ${{ env.TRIVY_VERSION }}
          # Trivy pulls the vuln DB on first run and caches it (cache-dir
          # defaults to ${{ github.workspace }}/.cache/trivy). We must NOT
          # set `offline-scan: true` here because the cache is empty on the
          # first run, which would make Trivy exit 1 with no DB.
          # 0 = never fail this step on findings; the dedicated gate step
          # below enforces CRITICAL as a hard failure.
          exit-code: '0'

      - name: Run Trivy filesystem scan
        continue-on-error: true
        uses: aquasecurity/trivy-action@v0.33.1
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-fs-results.sarif'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true
          version: ${{ env.TRIVY_VERSION }}
          exit-code: '0'

      - name: Upload Trivy image scan results to GitHub Security tab
        # The action errors when the SARIF file is absent; `continue-on-error`
        # ensures a missing file (e.g. due to a transient scan failure) does
        # not break the rest of the workflow. The scan failure is still
        # surfaced in the failed-step indicator of the GitHub Actions UI.
        continue-on-error: true
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: 'trivy-image-results.sarif'
          category: trivy-image

      - name: Upload Trivy filesystem scan results to GitHub Security tab
        continue-on-error: true
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: 'trivy-fs-results.sarif'
          category: trivy-fs

      - name: Fail build on CRITICAL vulnerabilities
        # This is the actual hard gate. We keep it separate from the SARIF
        # emitters so security alerts are never lost even if the gate
        # itself fails for infra reasons.
        uses: aquasecurity/trivy-action@v0.33.1
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          severity: 'CRITICAL'
          ignore-unfixed: true
          version: ${{ env.TRIVY_VERSION }}
          exit-code: '1'

      - name: Cleanup GHA cache
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            try {
              await github.request('DELETE /repos/{owner}/{repo}/actions/cache', {
                owner: context.repo.owner,
                repo: context.repo.repo,
              });
            } catch (e) {
              core.warning(`Cache cleanup skipped: ${e.message}`);
            }